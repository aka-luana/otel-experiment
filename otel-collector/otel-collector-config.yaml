receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        
processors:
  batch: {}
  
exporters:
  # traces usando jaeger atraves do otlp/grpc
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  
  # metricas
  prometheus:
    endpoint: 0.0.0.0:8889
    
  # logs com endpoint otlp nativo
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]